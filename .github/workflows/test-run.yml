name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches:
      - master
    types: [opened, synchronize]
    paths-ignore:
      - 'scripts/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  check:
    name: Check ipv6
    runs-on: windows-2022

    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '1.19'
      - uses: actions/checkout@v3
      - name: check IPv4
        run: curl -4 https://www.google.com
      - name: check IPv6
        run: curl -6 https://www.google.com
