name: Compare states

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  GO111MODULE: "on"

jobs:
  mainnet:
    name: Compare mainnet states
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.18

      - name: Run comparing script
        run: |
          go run ./scripts/compare-states/compare-states.go http://seed1.neo.org:10332 http://rpc10.n3.nspcc.ru:20332
